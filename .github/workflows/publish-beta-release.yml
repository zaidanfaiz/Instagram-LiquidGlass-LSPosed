name: Publish v0.1.0-beta.2

# Merge this workflow into main to trigger ONE guarded beta.2 release build.
# Manual reruns deliberately fail once the tag exists to avoid silently
# replacing APKs with a differently signed debug build.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beta-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-liquid-glass-beta-2
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, package and prerelease module APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-beta.2
    steps:
      - name: Check out release candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against overwriting an existing release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Refusing to replace its signed APK."
            exit 1
          fi

      - name: Protect proprietary APK before public visibility
        run: |
          set -euo pipefail
          # An internal analysis release contains the ORIGINAL Instagram
          # 452 app APK. It MUST NOT be public if the repository opens.
          # GitHub changes an existing release to an "untagged-..." web
          # URL when it becomes draft; /releases/tags/TAG may then return
          # 404. The stable REST numeric release ID is reliable instead.
          research_id=419376513
          if gh api "/repos/$GITHUB_REPOSITORY/releases/$research_id" >/dev/null 2>&1; then
            draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$research_id" --jq '.draft')"
            if [[ "$draft" != "true" ]]; then
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/releases/$research_id" -f draft=true >/dev/null
              draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$research_id" --jq '.draft')"
            fi
            if [[ "$draft" != "true" ]]; then
              echo "::error::Proprietary APK research release is not draft."
              exit 1
            fi
          else
            echo "Research release was removed; continuing."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare compile-only Xposed API 82
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --silent --show-error \
            https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/de/robv/android/xposed/api/82/api-82.jar \
            -o app/libs/api-82.jar
          test "$(wc -c < app/libs/api-82.jar)" -gt 20000

      - name: Compile the exact release source
        run: |
          set -euo pipefail
          grep -F "versionName '0.1.0-beta.2'" app/build.gradle
          gradle --no-daemon :app:assembleDebug

      - name: Verify signed APK and create SHA-256 checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/Instagram-LiquidGlass-v0.1.0-beta.2.apk
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner -type f | sort | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose \
            dist/Instagram-LiquidGlass-v0.1.0-beta.2.apk
          (cd dist && sha256sum Instagram-LiquidGlass-v0.1.0-beta.2.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          cat > dist/RELEASE_NOTES.beta2.md <<'BETA2_NOTES'
          ## Instagram Liquid Glass v0.1.0-beta.2

          **Beta update — expanded glass styling across selected Instagram controls.**

          - Glass rim and soft tint for recognized search fields, inbox filter chips, profile action buttons, reply/composer containers and selected toolbar actions.
          - Existing floating Home / Reels / DM / Profile navigation and separate Search capsule retained.
          - Conservative drawing via Android ViewOverlay: no view hierarchy replacement, no new touch interception and no Reels player modifications.
          - The new surfaces are translucent visual accents, not true iOS backdrop refraction or guaranteed real-time blur.
          - Actual coverage depends on Instagram resource names and layout. Unknown controls are deliberately skipped.

          **Test configuration:** POCO F7 Ultra, Android 16, Instagram 452.0.0.48.64 (previous development environment); beta.2 has not been independently validated on-device. Other builds may behave differently.

          Install the APK, enable the module for Instagram in LSPosed, then force-stop and reopen Instagram. Updates are manual; a changed debug signing key may require reinstalling **the module only**.
          BETA2_NOTES

      - name: Publish prerelease (repository stays PRIVATE)
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Instagram Liquid Glass v0.1.0-beta.2" \
            --notes-file dist/RELEASE_NOTES.beta2.md \
            dist/Instagram-LiquidGlass-v0.1.0-beta.2.apk \
            dist/SHA256SUMS.txt

      - name: Verify release contents
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json tagName,url,isDraft,isPrerelease,assets
          echo "Verification complete. No repository visibility change was performed."
